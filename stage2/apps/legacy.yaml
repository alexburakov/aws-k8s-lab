apiVersion: v1
kind: Namespace
metadata:
  name: legacy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-docs
  namespace: legacy
spec:
  replicas: 2
  selector:
    matchLabels: {app: legacy-docs}
  template:
    metadata:
      labels: {app: legacy-docs}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports: [{containerPort: 80}]
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
      volumes:
        - name: site
          gitRepo:
            repository: https://github.com/octocat/Spoon-Knife.git
            directory: "."
---
apiVersion: v1
kind: Service
metadata:
  name: legacy-docs
  namespace: legacy
spec:
  selector: {app: legacy-docs}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: legacy-docs
  namespace: legacy
spec:
  ingressClassName: nginx
  rules:
    - host: docs.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: legacy-docs
                port: {number: 80}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-api
  namespace: legacy
spec:
  replicas: 1
  selector:
    matchLabels: {app: legacy-api}
  template:
    metadata:
      labels: {app: legacy-api}
    spec:
      containers:
        - name: api
          image: hashicorp/http-echo:1.0.0
          args: ["-text=legacy-api", "-listen=:5678"]
          ports: [{containerPort: 5678}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: legacy-api
  namespace: legacy
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: legacy-api}
---
apiVersion: v1
kind: Service
metadata:
  name: legacy-api
  namespace: legacy
spec:
  selector: {app: legacy-api}
  ports: [{port: 80, targetPort: 5678}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: legacy-api
  namespace: legacy
spec:
  ingressClassName: nginx
  rules:
    - host: api.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: legacy-api
                port: {number: 80}
